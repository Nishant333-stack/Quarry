name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: quarry }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    env:
      QUARRY_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quarry
      QUARRY_DATABASE_URL: postgresql://quarry_app:quarry_app@localhost:5432/quarry
      QUARRY_TEST_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m quarry.admin init && python -m quarry.admin seed
      - run: python -m evals.run_eval offline --gate
