[project]
name = "quarry"
version = "0.1.0"
description = "Hybrid RAG over structured + unstructured enterprise data on Google Cloud"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "sqlglot>=25",
  "google-genai>=1.0",
  "pypdf>=5",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quarry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
